<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My trip | Trail With Us</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .checkout-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .checkout-head h2,
      .checkout-success h2 {
        font-size: clamp(1.8rem, 4vw, 2.45rem);
        margin: 0 0 8px;
      }
      .eyebrow {
        font-size: 0.76rem;
        letter-spacing: 0.16em;
        font-weight: 800;
        color: var(--n2);
        margin: 0 0 8px;
      }
      .checkout-sub {
        max-width: 54ch;
        opacity: 0.78;
        margin: 0;
      }
      .checkout-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        border: 2px solid var(--n2);
        border-radius: 999px;
        padding: 9px 14px;
        font-weight: 700;
        white-space: nowrap;
      }
      .checkout-back span {
        font-size: 1.25rem;
        line-height: 1;
      }
      .checkout-items {
        margin: 22px 0;
        border-top: 2px solid var(--n2);
      }
      .checkout-line {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 18px;
        padding: 14px 0;
        border-bottom: 1px solid #c3c3ca;
      }
      .checkout-line > div {
        min-width: 0;
      }
      .checkout-line small {
        display: block;
        opacity: 0.72;
        margin: 4px 0;
      }
      .checkout-remove {
        border: 0;
        background: transparent;
        color: #6d2940;
        text-decoration: underline;
        cursor: pointer;
        font: 600 0.82rem var(--b);
        padding: 2px 0;
      }
      .checkout-coupon {
        padding: 18px;
        background: #fff9e8;
        border: 2px solid var(--n2);
        border-radius: 16px;
        margin: 20px 0;
      }
      .checkout-coupon > label {
        display: block;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .coupon-row {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }
      .coupon-row input {
        flex: 1 1 180px;
        min-width: 0;
        width: auto;
        background: white;
        border: 2px solid var(--n2);
        border-radius: 11px;
        padding: 12px;
        font: inherit;
        color: var(--n0);
      }
      .coupon-row .btn {
        margin: 0;
      }
      .coupon-clear {
        border: 0;
        background: transparent;
        text-decoration: underline;
        color: var(--n0);
        font: 600 0.85rem var(--b);
        cursor: pointer;
        padding: 8px;
      }
      .coupon-message {
        font-size: 0.9rem;
        min-height: 0;
        margin: 0;
        opacity: 0;
      }
      .coupon-message.visible {
        margin-top: 9px;
        opacity: 1;
      }
      .coupon-message.success {
        color: #17603b;
        font-weight: 700;
      }
      .price-breakdown {
        margin: 18px 0;
        padding: 17px 0;
        border-top: 2px solid var(--n2);
        border-bottom: 2px solid var(--n2);
      }
      .price-breakdown > div {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        padding: 7px 0;
      }
      .price-breakdown .discount-value {
        color: #17603b;
      }
      .price-breakdown .grand-total {
        margin-top: 6px;
        padding-top: 14px;
        border-top: 1px dashed #999ba8;
        font-size: 1.08rem;
      }
      .grand-total strong {
        font-size: 1.45rem;
      }
      .checkout-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 22px;
      }
      .checkout-actions .btn {
        margin: 0;
      }
      .checkout-disclaimer {
        font-size: 0.86rem;
        line-height: 1.55;
        opacity: 0.74;
        margin-top: 20px;
        max-width: 80ch;
      }
      .checkout-empty,
      .checkout-success {
        padding: 8px 0;
      }
      .checkout-empty h2 {
        font-size: 2rem;
        margin-bottom: 8px;
      }
      .checkout-empty p {
        max-width: 56ch;
        margin: 0 0 20px;
      }
      .checkout-success .success-mark {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--n0);
        color: var(--cr);
        font-size: 1.5rem;
        margin-bottom: 16px;
      }
      #tp input:disabled,
      #tp button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      @media (max-width: 560px) {
        .checkout-back {
          font-size: 0.85rem;
        }
        .checkout-line {
          gap: 10px;
        }
        .checkout-coupon {
          padding: 13px;
        }
        .checkout-actions .btn {
          flex: 1 1 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body
    data-page="trip"
    data-title="My trip"
    data-sub="Everything you have picked, with one total."
    data-img="bridge"
  >
    <section style="padding: 60px 0 90px">
      <div class="w">
        <div
          class="card noadd"
          style="padding: 30px; max-width: 820px; margin: auto"
          id="tp"
        ></div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
    <script>
      (() => {
        const configured =
          window.SUPABASE_URL &&
          window.SUPABASE_ANON_KEY &&
          !window.SUPABASE_URL.includes("YOUR-PROJECT") &&
          !window.SUPABASE_ANON_KEY.includes("YOUR_SUPABASE") &&
          window.supabase;
        const money = (value) =>
          "₹" + Math.round(Number(value) || 0).toLocaleString("en-IN");
        let client = null,
          discountCode = "",
          discountPercent = 0,
          discountMessage = "",
          bookingBusy = false,
          tripDate = "";
        const localToday = () => {
          const d = new Date();
          d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
          return d.toISOString().slice(0, 10);
        };
        const safe = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const subtotal = () =>
          st.cart.reduce((sum, item) => sum + (Number(item.p) || 0), 0);
        const discountAmount = () =>
          Math.round(subtotal() * discountPercent * 100) / 100;
        const total = () => Math.max(0, subtotal() - discountAmount());
        async function boot() {
          if (!configured) {
            $("#tp").innerHTML =
              '<h2>Checkout is not configured</h2><p>Set your Supabase URL and publishable key in <code>supabase-config.js</code> before using account-gated checkout.</p><a class="btn" href="index.html">Back to the website</a>';
            return;
          }
          client =
            window.__twuSupabase ||
            (window.__twuSupabase = window.supabase.createClient(
              window.SUPABASE_URL,
              window.SUPABASE_ANON_KEY,
              {
                auth: {
                  persistSession: true,
                  autoRefreshToken: true,
                  storage: window.localStorage,
                },
              },
            ));
          const {
            data: { session },
            error,
          } = await client.auth.getSession();
          if (error) throw error;
          if (!session?.user) {
            location.replace(
              "login.html?next=" + encodeURIComponent("trip.html"),
            );
            return;
          }
          bind(renderCheckout);
          renderCheckout();
        }
        function renderCheckout() {
          const s = subtotal(),
            d = discountAmount(),
            t = total();
          if (!st.cart.length) {
            $("#tp").innerHTML =
              '<div class="checkout-empty"><h2>Nothing in your trip yet</h2><p>Add a guide, stay, ride, gear or package first. Your selections will be waiting here when you return.</p><a class="btn" href="guides.html">Find a guide</a></div>';
            return;
          }
          $("#tp").innerHTML =
            `<div class="checkout-head"><div><p class="eyebrow">YOUR TRIP</p><h2>Your trip summary</h2><p class="checkout-sub">Review your choices and apply a discount code before sending your request.</p></div><a class="checkout-back" href="javascript:history.back()" aria-label="Go back"><span aria-hidden="true">←</span> Keep exploring</a></div>
            <div class="checkout-items">${st.cart.map((c) => `<div class="checkout-line"><div><b>${safe(c.t)}</b><small>${safe(c.d)}</small><button type="button" class="checkout-remove" data-r="${safe(c.id)}">Remove</button></div><strong>${money(c.p)}</strong></div>`).join("")}</div>
            <div class="checkout-date"><label for="trip-start-date">Preferred trip start date</label><input type="date" id="trip-start-date" min="${localToday()}" value="${safe(tripDate)}" ${bookingBusy ? "disabled" : ""} required><small>We’ll use this date to review availability; it is not a confirmed reservation.</small></div>
            <div class="checkout-coupon"><label for="discount-code">Discount code</label><div class="coupon-row"><input id="discount-code" autocomplete="off" maxlength="40" placeholder="Enter code" value="${safe(discountCode)}" ${bookingBusy ? "disabled" : ""}><button type="button" class="btn alt" id="apply-discount" ${bookingBusy ? "disabled" : ""}>Apply code</button><button type="button" class="coupon-clear" id="clear-discount" ${!discountCode ? "hidden" : ""} aria-label="Remove discount code">Remove</button></div><p class="coupon-message ${discountPercent ? "success" : ""} ${discountMessage ? "visible" : ""}" id="coupon-message" role="status">${safe(discountMessage)}</p></div>
            <div class="price-breakdown"><div><span>Subtotal</span><b>${money(s)}</b></div><div><span>Discount${discountCode ? ` (${safe(discountCode.toUpperCase())}${discountPercent ? ` · ${Math.round(discountPercent * 100)}%` : ""})` : ""}</span><b class="discount-value">−${money(d)}</b></div><div class="grand-total"><span>Total due later</span><strong>${money(t)}</strong></div></div>
            <div class="checkout-actions"><button class="btn" id="submit-trip" ${bookingBusy ? "disabled" : ""}>${bookingBusy ? "Submitting…" : "Submit trip request"}</button><a class="btn alt" href="safety.html">Safety & GPS</a></div>
            <p class="checkout-disclaimer">Online payment is not enabled yet. Submitting creates a pending trip request, not a confirmed booking. The host/team must confirm availability and payment separately.</p>`;
        }
        async function applyDiscount() {
          const code = $("#discount-code")?.value.trim().toUpperCase() || "";
          discountMessage = "";
          discountCode = "";
          discountPercent = 0;
          if (!code) {
            discountMessage = "Enter a discount code first.";
            renderCheckout();
            return;
          }
          const applyBtn = $("#apply-discount");
          if (applyBtn) {
            applyBtn.disabled = true;
            applyBtn.textContent = "Checking…";
          }
          try {
            const { data, error } = await client.rpc("validate_discount_code", {
              p_code: code,
            });
            if (error) throw error;
            const row = Array.isArray(data) ? data[0] : data;
            const pct = Number(row?.percent_off);
            if (!Number.isFinite(pct) || pct <= 0 || pct > 100)
              throw new Error("That code is invalid, inactive or expired.");
            discountCode = code;
            discountPercent = pct / 100;
            discountMessage = `Code applied — ${pct}% off your trip subtotal.`;
          } catch (error) {
            discountCode = "";
            discountPercent = 0;
            discountMessage = error?.message?.includes(
              "Could not find the function",
            )
              ? "Discount validation is not installed yet. Run supabase-upgrade.sql in the Supabase SQL Editor."
              : error?.message || "Could not validate that code. Try again.";
          }
          renderCheckout();
        }
        async function submitTrip() {
          if (bookingBusy) return;
          const dateInput = $("#trip-start-date");
          tripDate = dateInput?.value || tripDate;
          if (!tripDate || tripDate < localToday()) {
            discountMessage = "Choose today or a future preferred start date.";
            renderCheckout();
            const msg = $("#coupon-message");
            if (msg) {
              msg.textContent = discountMessage;
              msg.classList.add("visible");
            }
            return;
          }
          const {
            data: { session },
            error: sessionError,
          } = await client.auth.getSession();
          if (sessionError || !session?.user) {
            location.href =
              "login.html?next=" + encodeURIComponent("trip.html");
            return;
          }
          bookingBusy = true;
          renderCheckout();
          try {
            const items = st.cart.map((c) => ({
              kind: c.kind,
              source_id: c.source_id,
              quantity: Number(c.quantity) || 0,
              lines: Array.isArray(c.lines) ? c.lines : [],
              origin: c.origin,
              destination: c.destination,
              destination_state: c.destination_state,
              travellers: Number(c.travellers) || 1,
              return_trip: !!c.return_trip,
              title: c.t,
              details: c.d,
              amount: Number(c.p) || 0,
            }));
            const { data, error } = await client.rpc("create_trip_request", {
              p_subtotal: subtotal(),
              p_discount_code: discountCode || null,
              p_items: items,
              p_start_date: tripDate,
            });
            if (error) throw error;
            const booking = Array.isArray(data) ? data[0] : data;
            const ref = booking?.booking_id
              ? String(booking.booking_id).slice(0, 8).toUpperCase()
              : "PENDING";
            const savedSubtotal = Number(
              booking?.subtotal_amount ?? subtotal(),
            );
            const savedDiscount = Number(
              booking?.discount_amount ?? discountAmount(),
            );
            const savedTotal = Number(booking?.total_amount ?? total());
            st.cart = [];
            save();
            cartCount();
            $("#tp").innerHTML =
              `<div class="checkout-success"><div class="success-mark" aria-hidden="true">✓</div><p class="eyebrow">REQUEST SUBMITTED</p><h2>Your trip request is in.</h2><p>Reference <strong>${safe(ref)}</strong>. Preferred start date: <strong>${safe(tripDate)}</strong>. This is a pending request; it is not confirmed until availability and payment are arranged.</p><div class="price-breakdown"><div><span>Subtotal</span><b>${money(savedSubtotal)}</b></div><div><span>Discount${discountCode ? ` (${safe(discountCode)})` : ""}</span><b class="discount-value">−${money(savedDiscount)}</b></div><div class="grand-total"><span>Estimated total</span><strong>${money(savedTotal)}</strong></div></div><div class="checkout-actions"><a class="btn" href="dashboard-user.html">View travel dashboard</a><a class="btn alt" href="index.html">Back to home</a></div><p class="checkout-disclaimer">No payment has been taken. You can view the pending request in your travel dashboard.</p></div>`;
            discountCode = "";
            discountPercent = 0;
            discountMessage = "";
          } catch (error) {
            bookingBusy = false;
            discountMessage = error?.message?.includes(
              "Could not find the function",
            )
              ? "Trip request submission is not installed yet. Run supabase-upgrade.sql in the Supabase SQL Editor."
              : error?.message ||
                "Could not submit this request. Your items are still saved.";
            renderCheckout();
            const msg = $("#coupon-message");
            if (msg) {
              msg.textContent = discountMessage;
              msg.classList.add("visible");
            }
            return;
          }
          bookingBusy = false;
        }
        document.addEventListener("click", async (e) => {
          if (e.target.closest("#apply-discount")) {
            await applyDiscount();
            return;
          }
          if (e.target.closest("#clear-discount")) {
            discountCode = "";
            discountPercent = 0;
            discountMessage = "Discount removed.";
            renderCheckout();
            return;
          }
          if (e.target.closest("#submit-trip")) {
            await submitTrip();
            return;
          }
          const remove = e.target.closest("[data-r]");
          if (remove) {
            st.cart = st.cart.filter((c) => c.id !== remove.dataset.r);
            save();
            cartCount();
            renderCheckout();
          }
        });
        document.addEventListener("change", (e) => {
          if (e.target.id === "trip-start-date") tripDate = e.target.value;
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && e.target.id === "discount-code") {
            e.preventDefault();
            applyDiscount();
          }
        });
        boot().catch((error) => {
          console.error(error);
          $("#tp").innerHTML =
            `<h2>Checkout could not load</h2><p>${safe(error?.message || "Check your Supabase setup and try again.")}</p><a class="btn" href="index.html">Back to the website</a>`;
        });
      })();
    </script>
    <script src="motion.js" defer></script>
  </body>
</html>
