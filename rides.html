<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rides | Trail With Us</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    data-page="rides"
    data-title="Rides"
    data-sub="Discover shared seats, local taxis and community-based transport for remote destinations. Prices are planning estimates; confirm routes, fares and availability."
    data-img="road"
  >
    <div class="w">
      <div class="ctl">
        <label>Pick up from<select data-k="from"></select></label
        ><label>State<select data-k="state"></select></label
        ><label>Place to visit<select data-k="dest"></select></label
        ><label>Travellers<select data-k="trav"></select></label>
      </div>
    </div>
    <section style="padding-bottom: 90px">
      <div class="w">
        <div class="ctl" style="margin: 0 0 30px; background: var(--n1)">
          <label
            >Trip<select data-k="rt">
              <option value="0">One way</option>
              <option value="1">Return</option>
            </select></label
          ><span id="rm" style="font-weight: 700; align-self: center"></span>
        </div>
        <div class="grid" id="l"></div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
    <script>
      bind(() => {
        const km = estimatedRoadKm(st.from, di());
        $("#rm").textContent =
          `${st.from} to ${st.dest}: about ${km} km, around ${(km / 38).toFixed(1)} hours. Planning estimate; confirm local routes and fares before travel.`;
        if (!VEH.length) {
          $("#l").innerHTML =
            `<div class="empty-state"><h2>No published ride options</h2><p>The admin has not published any transport rates yet.</p></div>`;
          return;
        }
        $("#l").innerHTML = VEH.map((v, i) => {
          const capacity = Number(v[3]) || (i === 0 ? 1 : i === 1 ? 4 : 6),
            cars = capacity === 1 ? st.trav : Math.ceil(st.trav / capacity),
            p = Math.round(km * v[1] * cars * (st.rt ? 2 : 1) * 100) / 100,
            it = {
              id: `r${st.from}${di()}${i}${st.trav}${st.rt}`,
              kind: "ride",
              source_id: v[4],
              origin: st.from,
              destination: st.dest,
              destination_state: STATE[di()] || "Assam",
              travellers: st.trav,
              return_trip: !!st.rt,
              t: `Ride: ${st.from} to ${st.dest}`,
              d:
                v[0] +
                (capacity === 1
                  ? `, ${st.trav} seat${st.trav > 1 ? "s" : ""}`
                  : `, ${cars} vehicle${cars > 1 ? "s" : ""}`) +
                (st.rt ? ", return" : ""),
              p,
            };
          return `<article class="card"><div class="gi" style="font-size:4.5rem">${safeText(v[2])}</div><div class="cb"><h3>${safeText(v[0])}</h3><small>${inr(v[1])} per km · ${st.rt ? "Return trip" : "One way"}</small><div class="bt"><span class="price">${inr(p)}</span>${btn(it)}</div></div></article>`;
        }).join("");
      });
      (async () => {
        const client = window.twuGetSupabaseClient?.();
        if (!client) return;
        try {
          const { data, error } = await client
            .from("trip_listings")
            .select("*")
            .eq("listing_type", "ride")
            .eq("is_published", true)
            .order("catalog_key", { ascending: true, nullsFirst: false })
            .order("title", { ascending: true });
          if (error) throw error;
          if (Array.isArray(data)) {
            VEH.splice(
              0,
              VEH.length,
              ...data.map((item) => [
                item.title,
                Number(item.price) || 0,
                item.emoji || "🚐",
                Number(item.capacity) || 1,
                item.id,
              ]),
            );
            redraw(true);
          }
        } catch (error) {
          console.warn("Shared ride rates could not be loaded.", error);
          VEH.splice(0, VEH.length);
          redraw(true);
        }
      })();
    </script>
    <script src="motion.js" defer></script>
  </body>
</html>
