<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Guide profile | Trail With Us</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    data-page="guide"
    data-title="Guide profile"
    data-sub="Meet the person who will walk the trail with you."
    data-img="valley"
  >
    <section style="padding: 60px 0 90px">
      <div class="w"><div class="card" id="gp"></div></div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
    <script>
      const i = Math.max(
        0,
        +(new URLSearchParams(location.search).get("id") || 0),
      );
      const RV = [
        [
          "Traveller note",
          "Reviews will appear here after completed and verified bookings.",
        ],
      ];
      bind(() => {
        const g = G[i];
        if (!g) {
          document.title = "Guide not available | Trail With Us";
          $("#gp").innerHTML =
            `<div class="empty-state"><span>🧭</span><h2>This guide profile is not available</h2><p>Only approved guide profiles are listed for booking. Explore destinations or return to the guide directory.</p><a class="btn" href="guides.html">Browse guide directory</a></div>`;
          return;
        }
        document.title = `${g[0]} | Trail With Us`;
        const rate = Number(g[4]) || 0;
        const face = g[9]
          ? `<img src="${safeText(g[9])}" alt="${safeText(g[0])}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
          : avatar(i, 240);
        const it = {
          id: `g${i}-${st.days}`,
          kind: "guide",
          source_id: g[12],
          quantity: st.days,
          travellers: st.trav,
          t: "Guide: " + g[0],
          d: `${st.days} day${st.days > 1 ? "s" : ""} in ${DEST[g[1]]}`,
          p: rate * st.days,
        };
        const languages = Array.isArray(g[2]) ? g[2] : [];
        const interestTags = Array.isArray(g[3]) ? g[3] : [];
        $("#gp").innerHTML =
          `<div class="gpg"><div style="background:var(--n2);display:grid;place-items:center;padding:30px"><div style="view-transition-name:av-${i};border-radius:50%;width:240px;height:240px;overflow:hidden">${face}</div></div><div class="cb gpg-content"><h2 class="gpg-name">${safeText(g[0])}</h2><small>📍 ${safeText(DEST[g[1]])}, ${safeText(STATE[g[1]])} · ${g[10] ? "Admin-approved listing" : "Example profile — not verified"}</small><p class="gpg-bio">${safeText(g[6])}</p><div class="chips">${languages.map((l) => `<i>🗣️ ${safeText(l)}</i>`).join("")}${interestTags.map((tag) => `<i>${safeText(tag)}</i>`).join("")}</div><h3 style="margin-top:26px">Traveller reviews</h3><p>Reviews will appear after completed bookings are reviewed and verified.</p><div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-top:20px"><label>Days<select data-k="days"></select></label><span class="price">${rate > 0 ? inr(it.p) : "Rate not set"}</span>${rate > 0 ? btn(it) : "<span>Contact for a rate before booking.</span>"}<a class="btn alt" href="guides.html${st.state !== "All states" ? "?state=" + encodeURIComponent(st.state) : ""}">All guides</a></div></div></div>`;
        $("[data-k=days]").innerHTML = [1, 2, 3, 4, 5, 6, 7]
          .map(
            (day) =>
              `<option${day === st.days ? " selected" : ""}>${day}</option>`,
          )
          .join("");
      });
    </script>
    <script src="motion.js" defer></script>
  </body>
</html>
