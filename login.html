<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in · Trail With Us</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .auth-wrap {
        position: relative;
        isolation: isolate;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 36px 18px;
        overflow: hidden;
        background: #010736;
      }
      .auth-slideshow {
        position: absolute;
        inset: 0;
        z-index: -2;
        overflow: hidden;
        background: #010736;
      }
      .auth-slide {
        position: absolute;
        inset: -2%;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transform: scale(1.04);
        animation: authCrossfade 24s infinite ease-in-out;
        will-change: opacity, transform;
      }
      .auth-slide:nth-child(1) {
        background-image: url("assets/slideshow1.jpg");
        animation-delay: 0s;
      }
      .auth-slide:nth-child(2) {
        background-image: url("assets/slideshow2.jpg");
        animation-delay: 6s;
      }
      .auth-slide:nth-child(3) {
        background-image: url("assets/slideshow3.jpg");
        animation-delay: 12s;
      }
      .auth-slide:nth-child(4) {
        background-image: url("assets/slideshow4.jpg");
        animation-delay: 18s;
      }
      .auth-slideshow:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          rgba(1, 7, 54, 0.68),
          rgba(1, 7, 54, 0.3) 55%,
          rgba(1, 7, 54, 0.55)
        );
      }
      @keyframes authCrossfade {
        0%,
        3% {
          opacity: 0;
          transform: scale(1.04);
        }
        8%,
        23% {
          opacity: 1;
          transform: scale(1);
        }
        29%,
        100% {
          opacity: 0;
          transform: scale(1.015);
        }
      }
      .auth-card {
        width: min(440px, 100%);
        color: #fff;
        padding: clamp(22px, 5vw, 38px);
        border: 1px solid rgba(255, 255, 255, 0.32);
        border-radius: 24px;
        background: rgba(10, 18, 48, 0.38);
        backdrop-filter: blur(22px) saturate(135%);
        -webkit-backdrop-filter: blur(22px) saturate(135%);
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.32),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
      .auth-card .logo {
        display: inline-block;
        background: rgba(252, 241, 208, 0.92);
        color: #010736;
      }
      .auth-card h1 {
        font-size: clamp(2rem, 7vw, 3rem);
        margin: 28px 0 18px;
        color: #fff;
      }
      .auth-card label {
        margin: 14px 0;
        color: #fff;
      }
      .auth-card input {
        width: 100%;
        min-width: 0;
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(255, 255, 255, 0.65);
      }
      .auth-password-wrap {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        margin-top: 4px;
      }
      .auth-password-wrap input {
        padding-right: 52px;
      }
      .auth-eye {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #010736;
        cursor: pointer;
        padding: 7px;
      }
      .auth-eye:hover {
        background: rgba(1, 7, 54, 0.08);
      }
      .auth-eye:focus-visible {
        outline: 2px solid #22396f;
        outline-offset: 2px;
      }
      .auth-eye svg {
        width: 22px;
        height: 22px;
        display: block;
        transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .auth-eye.is-visible svg {
        animation: eyeReveal 0.34s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .auth-eye .eye-slash {
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .auth-eye:not(.is-visible) .eye-slash {
        opacity: 1;
      }
      @keyframes eyeReveal {
        0% {
          transform: scale(0.72) rotate(-12deg);
        }
        65% {
          transform: scale(1.16) rotate(4deg);
        }
        100% {
          transform: scale(1) rotate(0);
        }
      }
      .auth-validation {
        font-size: 0.84rem;
        line-height: 1.35;
        margin: 7px 2px 0;
        color: #ffd0d0;
        min-height: 1.15em;
      }
      .auth-validation:empty {
        display: none;
      }
      .auth-card .btn:disabled {
        opacity: 0.48;
        cursor: not-allowed;
        filter: saturate(0.65);
      }
      .auth-field[hidden] {
        display: none !important;
      }
      .auth-card .btn {
        width: 100%;
        margin-top: 8px;
      }
      .auth-links {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .auth-links button {
        border: 0;
        background: none;
        text-decoration: underline;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .auth-status {
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.94);
        color: #010736;
        margin-top: 14px;
        display: none;
      }
      .auth-status.show {
        display: block;
      }
      .auth-status.error {
        color: #a11922;
      }
      .auth-status.ok {
        color: #14532d;
      }
      .auth-test-connection {
        display: block;
        margin: 10px auto 0;
        padding: 7px 10px;
        border: 0;
        background: transparent;
        color: rgba(255, 255, 255, 0.84);
        font: inherit;
        font-size: 0.82rem;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      .auth-test-connection:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      @media (max-width: 480px) {
        .auth-wrap {
          padding: 18px 14px;
        }
        .auth-card {
          border-radius: 20px;
          padding: 24px 20px;
        }
        .auth-card h1 {
          margin-top: 22px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .auth-slide {
          animation: none;
        }
        .auth-slide:first-child {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body data-page="login">
    <main class="auth-wrap">
      <div class="auth-slideshow" aria-hidden="true">
        <span class="auth-slide"></span><span class="auth-slide"></span
        ><span class="auth-slide"></span><span class="auth-slide"></span>
      </div>
      <section class="auth-card">
        <a class="logo" href="index.html">Trail With Us</a>
        <h1 id="auth-title" style="margin-top: 28px">Welcome back.</h1>
        <form id="auth-form">
          <label class="auth-field" id="name-wrap" hidden
            >Full name<input
              id="full-name"
              type="text"
              autocomplete="name"
              placeholder="Your full name"
          /></label>
          <label
            >Email<input
              id="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
          /></label>
          <label
            >Password<span class="auth-password-wrap"
              ><input
                id="password"
                type="password"
                autocomplete="current-password"
                required
                minlength="8"
                placeholder="At least 8 characters" /><button
                class="auth-eye"
                type="button"
                data-toggle-password="password"
                aria-label="Show password"
                aria-pressed="false"
                title="Show password"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                  <path class="eye-slash" d="M3 3l18 18" />
                </svg></button></span
          ></label>
          <label class="auth-field" id="confirm-wrap" hidden
            >Confirm password<span class="auth-password-wrap"
              ><input
                id="confirm-password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="Re-enter your password"
                aria-describedby="password-match-message" /><button
                class="auth-eye"
                type="button"
                data-toggle-password="confirm-password"
                aria-label="Show confirm password"
                aria-pressed="false"
                title="Show password"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                  <path class="eye-slash" d="M3 3l18 18" />
                </svg></button
            ></span>
            <div
              id="password-match-message"
              class="auth-validation"
              aria-live="polite"
            ></div
          ></label>
          <button class="btn" id="submit-btn" type="submit">Sign in</button>
        </form>
        <div class="auth-links">
          <button id="toggle-mode" type="button">Create an account</button
          ><button id="reset-password" type="button">Forgot password?</button>
        </div>
        <button id="test-connection" class="auth-test-connection" type="button">
          Troubleshoot connection
        </button>
        <div
          id="auth-status"
          class="auth-status"
          role="status"
          aria-live="polite"
        ></div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="motion.js" defer></script>
  </body>
</html>
