<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My profile · Trail With Us</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .account-wrap {
        max-width: 760px;
        margin: 48px auto;
        padding: 0 18px;
      }
      .account-card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: clamp(20px, 4vw, 36px);
        box-shadow: var(--shadow-soft);
      }
      .account-card label {
        display: block;
        margin: 16px 0;
        font-weight: 600;
      }
      .account-card input {
        display: block;
        width: 100%;
        min-width: 0;
        margin-top: 6px;
      }
      .profile-photo {
        width: 112px;
        height: 112px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid var(--n2);
        display: block;
        margin: 12px 0;
      }
      .status {
        margin-top: 16px;
        min-height: 1.5em;
        overflow-wrap: anywhere;
      }
      .account-hint {
        display: block;
        font-size: 0.9rem;
        color: var(--muted);
        opacity: 1;
        line-height: 1.5;
        margin-top: 5px;
      }
      .account-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .account-card button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
    </style>
  </head>
  <body data-page="account">
    <main class="account-wrap">
      <section class="account-card">
        <a class="logo" href="index.html">Trail With Us</a>
        <h1 style="margin-top: 22px">My profile</h1>
        <p>Edit your details and profile picture.</p>
        <img
          class="profile-photo"
          id="photo"
          src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=500&q=85"
          alt="Profile picture"
        />
        <label
          >Profile picture<input id="avatar-file" type="file" accept="image/*"
        /></label>
        <form id="profile-form">
          <label
            >Full name<input
              id="name"
              required
              maxlength="100"
              autocomplete="name"
          /></label>
          <label
            >Email address<input
              id="email"
              type="email"
              required
              maxlength="254"
              autocomplete="email"
            /><span class="account-hint"
              >Changing your email may require confirmation. You will be signed
              out after saving an email change.</span
            ></label
          >
          <label
            >Phone<input
              id="phone"
              type="tel"
              maxlength="30"
              autocomplete="tel"
          /></label>
          <div class="account-actions">
            <button class="btn" id="save-profile" type="submit">
              Save changes</button
            ><a class="btn alt" href="index.html">Back to website</a>
          </div>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
      (async () => {
        const $ = (selector) => document.querySelector(selector);
        const status = $("#status");
        const button = $("#save-profile");
        const cfg =
          window.SUPABASE_URL &&
          !window.SUPABASE_URL.includes("YOUR-PROJECT") &&
          window.SUPABASE_ANON_KEY &&
          !window.SUPABASE_ANON_KEY.includes("YOUR_SUPABASE");
        if (!cfg) {
          status.textContent =
            "Configure Supabase first in supabase-config.js.";
          return;
        }
        const sb = window.supabase.createClient(
          window.SUPABASE_URL,
          window.SUPABASE_ANON_KEY,
          {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              storage: window.localStorage,
            },
          },
        );
        const {
          data: { user },
          error: userError,
        } = await sb.auth.getUser();
        if (userError || !user) {
          location.href = "login.html";
          return;
        }
        let prof = null;
        async function load() {
          const result = await sb
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .single();
          if (result.error) {
            status.textContent = result.error.message;
            return;
          }
          prof = result.data;
          $("#name").value =
            prof.full_name || user.user_metadata?.full_name || "";
          $("#email").value = user.email || "";
          $("#phone").value = prof.phone || "";
          if (prof.avatar_url) $("#photo").src = prof.avatar_url;
        }
        await load();
        $("#avatar-file").addEventListener("change", (event) => {
          const file = event.target.files[0];
          if (!file) return;
          if (file.size > 3 * 1024 * 1024) {
            status.textContent = "Choose an image smaller than 3 MB.";
            event.target.value = "";
            return;
          }
          $("#photo").src = URL.createObjectURL(file);
        });
        $("#profile-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          if (!prof) {
            status.textContent =
              "Your profile could not be loaded. Refresh and try again.";
            return;
          }
          const name = $("#name").value.trim();
          const phone = $("#phone").value.trim() || null;
          const email = $("#email").value.trim();
          if (!name) {
            $("#name").focus();
            status.textContent = "Enter your full name.";
            return;
          }
          if (!$("#email").checkValidity()) {
            $("#email").reportValidity();
            return;
          }
          const emailChanged =
            email.toLowerCase() !== String(user.email || "").toLowerCase();
          button.disabled = true;
          const previousButtonText = button.textContent;
          button.textContent = "Saving…";
          status.textContent = "Saving your profile…";
          try {
            let avatarUrl = prof.avatar_url;
            const file = $("#avatar-file").files[0];
            if (file) {
              const ext =
                (file.name.split(".").pop() || "jpg")
                  .toLowerCase()
                  .replace(/[^a-z0-9]/g, "") || "jpg";
              const path = `${user.id}/avatar.${ext}`;
              const upload = await sb.storage
                .from("avatars")
                .upload(path, file, {
                  upsert: true,
                  contentType: file.type || "image/jpeg",
                });
              if (upload.error)
                throw new Error(
                  "Avatar upload failed: " + upload.error.message,
                );
              avatarUrl = sb.storage.from("avatars").getPublicUrl(path)
                .data.publicUrl;
            }
            const profileUpdate = await sb.rpc("update_my_profile", {
              p_full_name: name,
              p_phone: phone,
              p_avatar_url: avatarUrl || null,
            });
            if (profileUpdate.error) {
              const message = profileUpdate.error.message?.includes(
                "Could not find the function",
              )
                ? "Profile editing needs the latest database update. Run supabase-upgrade.sql in Supabase SQL Editor."
                : profileUpdate.error.message;
              throw new Error(message);
            }
            prof = { ...prof, full_name: name, phone, avatar_url: avatarUrl };
            if (emailChanged) {
              const update = await sb.auth.updateUser({ email });
              if (update.error) {
                status.textContent =
                  "Your name, phone and picture were saved, but the email was not changed: " +
                  update.error.message;
                return;
              }
              const updatedUser = update.data?.user;
              const pending =
                Boolean(updatedUser?.new_email) ||
                String(updatedUser?.email || "").toLowerCase() !==
                  email.toLowerCase();
              status.textContent = pending
                ? `Profile saved. Supabase sent a confirmation request for ${email}. Confirm it before signing in with the new email. Signing you out…`
                : `Email updated. You will be signed out; sign in again with ${email}.`;
              await new Promise((resolve) => setTimeout(resolve, 1800));
              await sb.auth.signOut();
              location.href = "login.html?email=" + encodeURIComponent(email);
              return;
            }
            status.textContent = "Profile saved.";
            if (avatarUrl) $("#photo").src = avatarUrl;
            $("#avatar-file").value = "";
          } catch (error) {
            status.textContent =
              error?.message ||
              "Could not save your profile. Please try again.";
          } finally {
            button.disabled = false;
            button.textContent = previousButtonText;
          }
        });
      })();
    </script>
    <script src="motion.js" defer></script>
  </body>
</html>
