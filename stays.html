<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stays | Trail With Us</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    data-page="stays"
    data-title="Stays"
    data-sub="Browse verified accommodation listings as they are added. All requests require provider availability confirmation."
    data-img="homestay"
  >
    <div class="w">
      <div class="ctl">
        <label>State<select data-k="state"></select></label
        ><label>Place to visit<select data-k="dest"></select></label
        ><label>Nights<select data-k="nights"></select></label
        ><label>Travellers<select data-k="trav"></select></label>
      </div>
    </div>
    <section style="padding-bottom: 90px">
      <div class="w"><div class="grid" id="l"></div></div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
    <script>
      let remoteStays = null;
      function renderStays() {
        if (remoteStays === null) {
          const available = S.map((h, i) => ({ h, i }))
            .filter(({ i }) => {
              if (st.state !== "All states") return STATE[i] === st.state;
              return STATE[i] === STATE[di()];
            })
            .sort((a, b) => (b.i === di()) - (a.i === di()));
          $("#l").innerHTML = available.length
            ? available.map((x) => stayCard(x.h, x.i)).join("")
            : `<div class="empty-state"><span>🏡</span><h2>Stay listings are not available here yet</h2><p>We do not have a property listing for ${safeText(st.dest)} in this catalogue. Browse a package or check another destination.</p><a class="btn" href="packages.html">Browse packages</a></div>`;
          return;
        }
        const state =
          st.state === "All states" ? STATE[di()] || "Assam" : st.state;
        const inState = remoteStays.filter((item) => item.state === state);
        const exact = inState.filter((item) => item.destination === st.dest);
        const available = exact.length ? exact : inState;
        const rooms = Math.ceil(st.trav / 2);
        $("#l").innerHTML = available.length
          ? available
              .map((item) => {
                const amount =
                  Math.round(Number(item.price) * st.nights * rooms * 100) /
                  100;
                const id = `stay-${item.id}-${st.nights}-${rooms}`;
                const tripItem = {
                  id,
                  kind: "stay",
                  source_id: item.id,
                  quantity: st.nights * rooms,
                  travellers: st.trav,
                  t: `Stay: ${item.title}`,
                  d: `${st.nights} night${st.nights > 1 ? "s" : ""}, ${rooms} room${rooms > 1 ? "s" : ""} · ${item.destination}`,
                  p: amount,
                };
                const catalogIndex = DEST.indexOf(item.destination);
                const imageUrl = String(item.image_url || "").trim();
                const photo =
                  imageUrl &&
                  (imageUrl.startsWith("assets/") ||
                    /^https:\/\//i.test(imageUrl))
                    ? `<div class="pic" role="img" aria-label="${safeText(item.title)}" style="background-image:url(&quot;${safeText(imageUrl)}&quot;)">`
                    : catalogIndex >= 0
                      ? pic(catalogIndex)
                      : `<div class="pic" role="img" aria-label="${safeText(item.title)}" style="background-image:url(assets/homestay.jpg)">`;
                return `<article class="card">${photo}<span class="tagc">${safeText(item.state)}${exact.length ? " · At your destination" : " · Nearby in this state"}</span></div><div class="cb"><h3>${safeText(item.title)}</h3><small>📍 ${safeText(item.destination)} · ${safeText(item.unit || "per room/night")}</small><p>${safeText(item.description)}</p><div class="bt"><div><span class="price">${inr(amount)}</span><small>${inr(Number(item.price))} per room, night</small></div>${btn(tripItem)}</div></div></article>`;
              })
              .join("")
          : `<div class="empty-state"><span>🏡</span><h2>No published stays for ${safeText(state)} yet</h2><p>Try another destination or browse a curated package.</p><a class="btn" href="packages.html">Browse packages</a></div>`;
      }
      bind(renderStays);
      (async () => {
        const client = window.twuGetSupabaseClient?.();
        if (!client) return;
        try {
          const { data, error } = await client
            .from("trip_listings")
            .select("*")
            .eq("listing_type", "stay")
            .eq("is_published", true)
            .order("created_at", { ascending: true });
          if (error) throw error;
          remoteStays = Array.isArray(data) ? data : [];
          renderStays();
        } catch (error) {
          console.warn("Shared stay inventory could not be loaded.", error);
          remoteStays = [];
          renderStays();
        }
      })();
    </script>
    <script src="motion.js" defer></script>
  </body>
</html>
